# Railway deploy settings for Fakhra Panel (Config as Code).
#
# Key names follow Railway's published schema (https://railway.com/railway.schema.json):
#   healthcheckPath     -> GET /api/health must return 2xx before traffic shifts
#   healthcheckTimeout  -> seconds to wait for it
#   restartPolicyType   -> "ON_FAILURE" = restart on crash, up to max retries
# (The plan's spec phrasing "healthcheck-path / healthcheck-timeout /
#  restart-policy = on_failure" maps onto these schema keys; the schema names
#  are the ones Railway actually reads.)
#
# Note: Railway is deprecating Config as Code — hard cutoff 2026-12-01.
# Existing services read this file until then; NEW services cannot opt in and
# never read it at all. For those, set the same three values in the service
# Settings instead (healthcheck path /api/health, timeout 30 s, restart
# policy on-failure) — the primary path documented in DEPLOY.md §5.

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
