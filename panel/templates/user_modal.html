<div id="user-modal" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-username">
    <div class="modal-header">
      <h3 id="modal-username">User</h3>
      <button type="button" class="btn-close" id="modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="qr-code">
        <img id="qr-img" alt="QR code for the share link">
      </div>
      <label for="link-uri">Share link</label>
      <input id="link-uri" class="share-uri" type="text" readonly>
      <button type="button" class="btn btn-sm btn-secondary" id="copy-link">Copy link</button>
      <p id="modal-notice" class="alert alert-success" hidden></p>
      <p id="modal-error" class="alert alert-error" role="alert" hidden></p>
      <form id="edit-form">
        <div class="form-group">
          <label for="edit-quota">Quota (GB, empty = unlimited)</label>
          <input id="edit-quota" type="number" min="0.001" step="any">
        </div>
        <div class="form-group">
          <label for="edit-expires">Expires (empty = never)</label>
          <input id="edit-expires" type="datetime-local">
        </div>
        <div class="form-group">
          <label for="edit-note">Note</label>
          <input id="edit-note" type="text">
        </div>
        <button type="submit" class="btn btn-full" id="edit-save">Save changes</button>
      </form>
      <button type="button" class="btn btn-warning btn-full" id="reset-password">Reset password</button>
    </div>
  </div>
</div>
