<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fakhra Panel{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>
    /* pre-paint theme boot: read the saved theme before the body renders
       so there's no flash of the wrong theme. */
    try {
      var t = localStorage.getItem("fakhra-theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <script src="/static/theme.js" defer></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    body.shell {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 20rem;
      padding: 2rem;
      background: var(--card);
      border-radius: 8px;
      box-shadow: 0 1px 4px rgb(0 0 0 / 12%);
    }
    h1 {
      margin-top: 0;
      font-size: 1.25rem;
      text-align: center;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    label {
      font-size: 0.875rem;
      font-weight: 600;
    }
    input {
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 1rem;
    }
    button {
      padding: 0.6rem;
      border: 0;
      border-radius: 4px;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    .error {
      margin: 0 0 0.5rem;
      padding: 0.5rem;
      border-radius: 4px;
      background: var(--alert-error-bg);
      color: var(--alert-error-text);
      font-size: 0.875rem;
      text-align: center;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}shell{% endblock %}">
  {% block content %}{% endblock %}
</body>
</html>
